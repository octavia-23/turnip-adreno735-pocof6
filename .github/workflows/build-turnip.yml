name: Build Turnip Adreno 735 (POCO F6 / 8s Gen 3)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Custom Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            python3-pip \
            python3-mako \
            python3-yaml \
            bison \
            flex \
            glslang-tools \
            pkg-config \
            zip \
            unzip \
            curl \
            git
          pip3 install --break-system-packages meson

      - name: Setup Android NDK r26c
        run: |
          curl -sLo ndk.zip https://dl.google.com/android/repository/android-ndk-r26c-linux.zip
          unzip -q ndk.zip
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r26c" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/android-ndk-r26c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Clone Upstream Mesa
        run: |
          git clone --depth=1 https://gitlab.freedesktop.org/mesa/mesa.git mesa-src
          cd mesa-src
          echo "Mesa commit: $(git rev-parse HEAD)"

      - name: Apply Adreno 735 Optimization Patches
        run: |
          cd mesa-src
          echo "Applying Adreno 735 optimization patch series..."
          for patch in ../patches/*.patch; do
            if [ -f "$patch" ]; then
              echo "==> Applying patch: $patch"
              git apply --verbose "$patch"
            fi
          done

      - name: Generate Cross-Compilation File
        run: |
          cat << EOF > android-aarch64.ini
          [binaries]
          c = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang'
          cpp = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang++'
          ar = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config = ['pkg-config']

          [built-in options]
          c_args = ['-I$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include']
          cpp_args = ['-I$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include']

          [properties]
          sys_root = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot'
          pkg_config_libdir = ''

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

      - name: Configure Meson Build
        run: |
          cd mesa-src
          meson setup build-android \
            --cross-file ../android-aarch64.ini \
            -Dbuildtype=release \
            -Dstrip=true \
            -Dplatforms=android \
            -Dplatform-sdk-version=34 \
            -Dandroid-stub=true \
            -Degl=disabled \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dglx=disabled \
            -Dopengl=false \
            -Dzstd=disabled \
            -Dspirv-tools=disabled \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Dtools= \
            -Db_lto=false

      - name: Compile Turnip Vulkan Driver
        run: |
          cd mesa-src
          ninja -C build-android src/freedreno/vulkan/libvulkan_freedreno.so

      - name: Package Driver Zip for Emulators and Native Ports
        run: |
          mkdir -p output/driver
          cp mesa-src/build-android/src/freedreno/vulkan/libvulkan_freedreno.so output/driver/vulkan.ad07xx.so
          cp mesa-src/build-android/src/freedreno/vulkan/libvulkan_freedreno.so output/driver/vulkan.adreno.so
          cp meta.json output/driver/meta.json
          cd output/driver
          zip -r ../turnip-adreno735-8sgen3-pocof6.zip .
          cd ../..

      - name: Upload Driver Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-Adreno735-8sGen3-v1.3.3
          path: output/turnip-adreno735-8sgen3-pocof6.zip

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.3
          name: "Turnip Adreno 735 v1.3.3 (POCO F6 / 8s Gen 3)"
          body: |
            Production optimization release for Snapdragon 8s Gen 3 (`SM8635` / Adreno 735).
            
            ### v1.3.3 Architectural Refinements:
            - **Safe Autotuner Counter Bypass**: Cleanly routes autotuning decisions to the tuned static GMEM cost model, eliminating runtime performance counter sampling stalls while guaranteeing tile feasibility.
            - **Strict CI Patch Enforcement**: Enforced strict patch verification in CI to guarantee zero skipped or degraded hunks.
            - **Purged Invalid Contract Overrides**: Cleaned up redundant property queries, relying on Mesa's native 64-byte sampler alignments and Vulkan 1.2 custom border colors.
            
            ### Included Optimization Stack:
            - **0001 (GMEM Binning Bias)**: 1.6x sysmem penalty keeps rendering on-chip to save DRAM power and prevent POCO F6 thermal throttling.
            - **0002 (IR3 FP16 & Reg Pressure Cap)**: Preserves maximum SP wave occupancy (< 28 registers) and doubles FP16 ALU throughput without truncating HDR/depth outputs.
            - **0003 (Autotuner Sampling Bypass)**: Eliminates frame pacing micro-stutter by skipping dynamic counter queries.
            - **0004 (FTZ Denormals)**: Removes subnormal float overhead on ALU execution units.
            - **0005 (Embedded drirc Profiles)**: Pre-configured low-latency profiles for Winlator, Sudachi, Vita3K, and shadPS4.
          files: output/turnip-adreno735-8sgen3-pocof6.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
